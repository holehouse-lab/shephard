# .coveragerc-style config to control coverage.py / pytest-cov
[coverage:run]
omit =
    # Omit the tests
    */tests/*
    # Omit the versioningit-generated file
    shephard/_version.py

# define consistent style
[yapf]
COLUMN_LIMIT = 119
INDENT_WIDTH = 4
USE_TABS = False

# define consistent style
[flake8]
max-line-length = 119
