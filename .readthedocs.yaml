# Read the Docs build configuration
# https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"

# Install the docs requirements *and* the package itself so autodoc can
# import shephard while building the API documentation.
python:
  install:
    - requirements: docs/requirements.txt
    - method: pip
      path: .

# Sphinx configuration
sphinx:
  configuration: docs/conf.py
