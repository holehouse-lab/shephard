[build-system]

# SHEPHARD is a pure-Python package (no compiled extensions), so the build
# only needs setuptools + versioningit. numpy is a *runtime* dependency and
# is declared under [project.dependencies], not here.
requires = ["setuptools>=61", "versioningit~=2.0"]
build-backend = "setuptools.build_meta"


# define project info
[project]
name = "SHEPHARD"
dynamic = ["version"]
description = "Python package for organizing large sets of protein data"
authors = [
    {name = "Alex Holehouse", email = "alex.holehouse@wustl.edu"},
    {name = "Garrett M. Ginell"},
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.8"
keywords = ["bioinformatics", "proteome", "protein", "disorder", "annotation"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# runtime dependencies
dependencies = [
    "numpy",
    "protfasta",
]

[project.optional-dependencies]
test = [
    "pytest>=6.1.2",
    "pytest-cov",
]

[project.urls]
Homepage = "https://github.com/holehouse-lab/shephard"
Documentation = "https://shephard.readthedocs.io/"
Source = "https://github.com/holehouse-lab/shephard"
Issues = "https://github.com/holehouse-lab/shephard/issues"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
namespaces = true
where = ["."]
include = ["shephard", "shephard.*"]  # Discover all sub-packages inside the main package

[tool.setuptools.package-data]
# Ship the typing marker and the bundled data files (test_data/, look_and_say
# .dat, ...) so they are available from an installed wheel - shephard.get_data
# relies on these being present alongside the package.
shephard = [
    "py.typed",
    "data/**/*",
]

[tool.pytest.ini_options]
testpaths = ["shephard/tests"]

[tool.versioningit]
default-version = "1+unknown"

[tool.versioningit.format]
distance = "{base_version}+{distance}.{vcs}{rev}"
dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"
distance-dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"

[tool.versioningit.vcs]
# The method key:
method = "git"  # <- The method name
# Parameters to pass to the method:
match = ["*"]
default-tag = "1.0.0"

[tool.versioningit.write]
file = "shephard/_version.py"
